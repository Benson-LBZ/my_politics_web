<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia Political Analytics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="hero-section py-5 mb-4 text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">Malaysia GE16 Dynamics Tracker</h1>
            <p class="lead">Real-time data synchronization & coalition seat projections.</p>
            <span class="badge bg-light text-dark p-2" id="update-timestamp">Loading timestamp...</span>
        </div>
    </div>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card p-3 bg-white border-start border-primary border-4">
                    <h5 class="text-primary fw-bold">🔥 Latest Strategic Insight</h5>
                    <p class="mb-0 text-muted" id="news-ticker">Fetching latest political developments...</p>
                </div>
            </div>
        </div>

        <h3 class="mb-3 fw-bold text-secondary">Coalition Projections</h3>
        <div class="row g-3" id="coalition-container">
            </div>
    </div>

    <script>
        const jsonUrl = './data/ge16_tracker.json';

        async function fetchPoliticalData() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) throw new Error('Failed to load JSON data.');
                
                const data = await response.json();

                // 1. Update Timestamp & News
                document.getElementById('update-timestamp').innerText = `Last Updated: ${data.last_updated}`;
                document.getElementById('news-ticker').innerText = data.latest_news;

                // 2. Clear placeholder and build Coalition Cards dynamically
                const container = document.getElementById('coalition-container');
                container.innerHTML = '';

                data.coalition_status.forEach(party => {
                    const cardHtml = `
                        <div class="col-md-6 col-lg-3">
                            <div class="card h-100">
                                <div class="card-body d-flex flex-column">
                                    <div class="d-flex align-items-center mb-2">
                                        <div style="width: 15px; height: 15px; background-color: ${party.color}; border-radius: 50%; margin-right: 10px;"></div>
                                        <h5 class="card-title mb-0 fw-bold">${party.name}</h5>
                                    </div>
                                    <h2 class="display-6 fw-bold my-2 text-dark">${party.seats_predicted} <span class="fs-6 text-muted">/ ${data.total_seats}</span></h2>
                                    <p class="card-text text-muted small mt-auto">${party.status}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                });

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('news-ticker').innerText = 'Error loading live tracker data. Ensure data/ge16_tracker.json exists.';
            }
        }

        // Run the fetch function when page loads
        window.onload = fetchPoliticalData;
    </script>
</body>
</html>
