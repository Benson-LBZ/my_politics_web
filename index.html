<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia GE16 Live Dynamic Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
        .live-pulse { width: 10px; height: 10px; background-color: #22c55e; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
        .monitor-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; transition: all 0.3s ease; }
        .monitor-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .text-neon-blue { color: #3b82f6; text-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="d-flex align-items-center justify-content-between border-bottom border-secondary pb-3 mb-4">
            <div>
                <h1 class="fw-bold text-neon-blue mb-1">🇲🇾 马来西亚政坛局势实时监控</h1>
                <p class="text-muted mb-0">基于 Live Data 自动化同步的国会席位与战略动态跟踪</p>
            </div>
            <div class="text-end">
                <span class="badge bg-dark border border-secondary p-2 d-flex align-items-center gap-2">
                    <span class="live-pulse"></span>
                    <span id="live-clock">数据连接中...</span>
                </span>
            </div>
        </div>

        <div class="alert alert-danger bg-danger bg-opacity-10 border-danger text-danger mb-4" role="alert">
            <strong class="d-block mb-1">📢 当前局势密报：</strong>
            <span id="alert-news">正在提取最新情资...</span>
        </div>

        <div class="monitor-card p-4 mb-4">
            <h5 class="fw-bold mb-3">国会控制权进度（过半执政门槛：112 席）</h5>
            <div class="progress bg-secondary bg-opacity-20" style="height: 25px;" id="progress-bar-container">
                </div>
        </div>

        <h4 class="fw-bold mb-3 text-muted">Coalition Analytics / 阵营透视</h4>
        <div class="row g-3" id="coalition-grid">
            </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                // 强制清除浏览器缓存，确保拿到最新 Live 状态
                const response = await fetch('./data/ge16_live.json?t=' + list = Date.now());
                const data = await response.json();

                // 更新时钟与新闻
                document.getElementById('live-clock').innerText = `LIVE: ${data.last_updated}`;
                document.getElementById('alert-news').innerText = data.alert_news;

                // 渲染进度条
                const pContainer = document.getElementById('progress-bar-container');
                pContainer.innerHTML = '';
                data.coalitions.forEach(c => {
                    const pct = (c.seats / data.total_seats) * 100;
                    pContainer.innerHTML += `
                        <div class="progress-bar fw-bold" role="progressbar" 
                             style="width: ${pct}%; background-color: ${c.color};" 
                             title="${c.name}: ${c.seats}席">
                             ${c.seats}
                        </div>`;
                });

                // 渲染卡片
                const grid = document.getElementById('coalition-grid');
                grid.innerHTML = '';
                data.coalitions.forEach(c => {
                    grid.innerHTML += `
                        <div class="col-md-6 col-lg-3">
                            <div class="monitor-card p-3 h-100 d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold mb-0">${c.name}</h6>
                                    <span class="badge" style="background-color: ${c.color}">席位</span>
                                </div>
                                <h2 class="display-5 fw-bold my-2">${c.seats} <span class="fs-6 text-muted">/ 222</span></h2>
                                <p class="text-muted small mt-auto mb-0" style="border-left: 2px solid ${c.color}; padding-left: 8px;">
                                    ${c.strategy}
                                </p>
                            </div>
                        </div>`;
                });

            } catch (e) {
                console.error("读取 Live Data 失败：", e);
            }
        }

        window.onload = updateDashboard;
    </script>
</body>
</html>
